[project]
name = "meal-planner-bot"
version = "0.1.0"
description = "Telegram-based family meal planning assistant powered by LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.17.0",
    "litellm>=1.60.0",
    "boto3>=1.36.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "moto[dynamodb]>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
strict = true
disallow_untyped_defs = true

[tool.hatch.build.targets.wheel]
packages = ["src/meal_planner"]

