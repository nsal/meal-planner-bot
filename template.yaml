AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Meal Planner Bot - Telegram family meal planning assistant powered by LLM.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
  TelegramBotTokenSecretName:
    Type: String
    Description: Secrets Manager secret name for the Telegram Bot Token
  TelegramWebhookSecretName:
    Type: String
    Description: Secrets Manager secret name for the Telegram webhook secret
  LlmApiKeySecretName:
    Type: String
    Description: Secrets Manager secret name for the LiteLLM API key
  TelegramAllowedUserIds:
    Type: String
    AllowedPattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$'
    Description: >
      Comma-separated positive numeric Telegram user IDs allowed to use the
      Bot Lambda
  ConversationalLlmModel:
    Type: String
    Default: gpt-5.6-luna
    Description: LiteLLM model identifier for conversational replies
  ConversationalLlmReasoningEffort:
    Type: String
    Default: medium
    AllowedValues: [none, minimal, low, medium, high, xhigh, max]
    Description: Reasoning effort for conversational replies
  PlannerLlmModel:
    Type: String
    Default: gpt-5.6-luna
    Description: LiteLLM model identifier for plans and groceries
  PlannerLlmReasoningEffort:
    Type: String
    Default: high
    AllowedValues: [none, minimal, low, medium, high, xhigh, max]
    Description: Reasoning effort for plans and groceries
  SecretRefreshToken:
    Type: String
    Description: Change this non-secret token whenever a referenced secret rotates

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.14
    Architectures:
      - arm64
    Environment:
      Variables:
        DYNAMODB_TABLE_NAME: !Ref MealPlannerTable
        TELEGRAM_BOT_TOKEN: !Sub
          - '{{resolve:secretsmanager:${SecretName}:SecretString}}'
          - SecretName: !Ref TelegramBotTokenSecretName
        LLM_API_KEY: !Sub
          - '{{resolve:secretsmanager:${SecretName}:SecretString}}'
          - SecretName: !Ref LlmApiKeySecretName
        CONVERSATIONAL_LLM_MODEL: !Ref ConversationalLlmModel
        CONVERSATIONAL_LLM_REASONING_EFFORT: !Ref ConversationalLlmReasoningEffort
        PLANNER_LLM_MODEL: !Ref PlannerLlmModel
        PLANNER_LLM_REASONING_EFFORT: !Ref PlannerLlmReasoningEffort
        SECRET_REFRESH_TOKEN: !Ref SecretRefreshToken

Resources:
  MealPlannerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  BotFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python-uv
      SamResourceId: BotFunction
    Properties:
      FunctionName: !Sub ${AWS::StackName}-bot
      CodeUri: ./
      Handler: meal_planner.bot_handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          PLANNER_FUNCTION_NAME: !Ref PlannerFunction
          TELEGRAM_WEBHOOK_SECRET: !Sub
            - '{{resolve:secretsmanager:${SecretName}:SecretString}}'
            - SecretName: !Ref TelegramWebhookSecretName
          TELEGRAM_ALLOWED_USER_IDS: !Ref TelegramAllowedUserIds
          BOT_FUNCTION_TIMEOUT_SECONDS: '30'
          BOT_TELEGRAM_REQUEST_TIMEOUT_SECONDS: '5'
          BOT_LLM_REQUEST_TIMEOUT_SECONDS: '6'
          BOT_LLM_MAX_RETRIES: '2'
          BOT_LLM_INITIAL_BACKOFF_SECONDS: '1'
          BOT_HANDLER_SAFETY_MARGIN_SECONDS: '4'
          SECRET_REFRESH_TOKEN: !Ref SecretRefreshToken
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MealPlannerTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:TransactWriteItems
              Resource: !GetAtt MealPlannerTable.Arn
        - LambdaInvokePolicy:
            FunctionName: !Ref PlannerFunction
      Events:
        TelegramWebhook:
          Type: HttpApi
          Properties:
            Path: /webhook
            Method: post

  PlannerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python-uv
      SamResourceId: PlannerFunction
    Properties:
      FunctionName: !Sub ${AWS::StackName}-planner
      CodeUri: ./
      Handler: meal_planner.planner_handler.lambda_handler
      Timeout: 310
      MemorySize: 512
      Environment:
        Variables:
          PLANNER_FUNCTION_TIMEOUT_SECONDS: '300'
          PLANNER_TELEGRAM_REQUEST_TIMEOUT_SECONDS: '10'
          PLANNER_LLM_REQUEST_TIMEOUT_SECONDS: '45'
          PLANNER_LLM_MAX_RETRIES: '2'
          PLANNER_LLM_INITIAL_BACKOFF_SECONDS: '1'
          PLANNER_HANDLER_SAFETY_MARGIN_SECONDS: '20'
          SECRET_REFRESH_TOKEN: !Ref SecretRefreshToken
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MealPlannerTable

Outputs:
  WebhookUrl:
    Description: Telegram Webhook URL to configure in setWebhook
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/webhook
  MealPlannerTableName:
    Description: DynamoDB Table Name
    Value: !Ref MealPlannerTable
  BotFunctionName:
    Description: Bot Lambda Function Name
    Value: !Ref BotFunction
  PlannerFunctionName:
    Description: Planner Lambda Function Name
    Value: !Ref PlannerFunction
