AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Meal Planner Bot - Telegram family meal planning assistant powered by LLM.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
  AppSecretsSecretName:
    Type: String
    Description: Secrets Manager secret name for the application JSON secret
  TelegramAllowedUserIds:
    Type: String
    AllowedPattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$'
    Description: >
      Comma-separated positive numeric Telegram user IDs allowed to use the
      Bot Lambda
  PlanChatLlmModel:
    Type: String
    Default: gpt-5.6-luna
    Description: LiteLLM model identifier for Plan Chat drafts
  PlanChatLlmReasoningEffort:
    Type: String
    Default: high
    AllowedValues: [none, minimal, low, medium, high, xhigh, max]
    Description: Reasoning effort for Plan Chat drafts
  SecretRefreshToken:
    Type: String
    Description: Change this non-secret token whenever a referenced secret rotates

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.14
    Architectures:
      - arm64
    Environment:
      Variables:
        DYNAMODB_TABLE_NAME: !Ref MealPlannerTable
        TELEGRAM_BOT_TOKEN: !Sub
          - '{{resolve:secretsmanager:${SecretName}:SecretString:telegram_bot_token}}'
          - SecretName: !Ref AppSecretsSecretName
        SECRET_REFRESH_TOKEN: !Ref SecretRefreshToken

Resources:
  MealPlannerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  BotFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python-uv
      SamResourceId: BotFunction
    Properties:
      FunctionName: !Sub ${AWS::StackName}-bot
      CodeUri: ./
      Handler: meal_planner.bot_handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          PLAN_CHAT_FUNCTION_NAME: !Ref PlanChatFunction
          TELEGRAM_WEBHOOK_SECRET: !Sub
            - '{{resolve:secretsmanager:${SecretName}:SecretString:telegram_webhook_secret}}'
            - SecretName: !Ref AppSecretsSecretName
          TELEGRAM_ALLOWED_USER_IDS: !Ref TelegramAllowedUserIds
          BOT_TELEGRAM_REQUEST_TIMEOUT_SECONDS: '5'
          SECRET_REFRESH_TOKEN: !Ref SecretRefreshToken
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MealPlannerTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:TransactWriteItems
              Resource: !GetAtt MealPlannerTable.Arn
        - LambdaInvokePolicy:
            FunctionName: !Ref PlanChatFunction
      Events:
        TelegramWebhook:
          Type: HttpApi
          Properties:
            Path: /webhook
            Method: post

  PlanChatFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python-uv
      SamResourceId: PlanChatFunction
    Properties:
      FunctionName: !Sub ${AWS::StackName}-plan-chat
      CodeUri: ./
      Handler: meal_planner.plan_chat_handler.lambda_handler
      Timeout: 310
      MemorySize: 512
      Environment:
        Variables:
          LLM_API_KEY: !Sub
            - '{{resolve:secretsmanager:${SecretName}:SecretString:llm_api_key}}'
            - SecretName: !Ref AppSecretsSecretName
          PLAN_CHAT_LLM_MODEL: !Ref PlanChatLlmModel
          PLAN_CHAT_LLM_REASONING_EFFORT: !Ref PlanChatLlmReasoningEffort
          PLAN_CHAT_TELEGRAM_REQUEST_TIMEOUT_SECONDS: '10'
          PLAN_CHAT_LLM_REQUEST_TIMEOUT_SECONDS: '240'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt MealPlannerTable.Arn

Outputs:
  WebhookUrl:
    Description: Telegram Webhook URL to configure in setWebhook
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/webhook
  MealPlannerTableName:
    Description: DynamoDB Table Name
    Value: !Ref MealPlannerTable
  BotFunctionName:
    Description: Bot Lambda Function Name
    Value: !Ref BotFunction
  PlanChatFunctionName:
    Description: Plan Chat Lambda Function Name
    Value: !Ref PlanChatFunction
